# Baixa os dados públicos do IBGE todo dia e, se mudaram, faz commit de data/rbmc.json
# (o commit dispara o workflow de publicação).
name: Atualizar dados da RBMC

on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/atualizar_rbmc.py
      - name: Commit se houve mudança
        run: |
          if git diff --quiet data/rbmc.json; then echo "sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dados: atualização automática da RBMC"
          git push
